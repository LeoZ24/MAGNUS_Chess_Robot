name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Stockfish para los tests de integración del engine (los unitarios
      # usan FakeBackend y no lo necesitan).
      - name: Instalar Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest tests/ -v
